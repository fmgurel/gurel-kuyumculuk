<title>Gürel Kuyumculuk Tamir Takip</title>
<style>
  :root{
    --bg:#0d0c0a; --bg2:#161412; --card:#1c1915; --card2:#221e18; --ink:#f2ede3; --muted:#9a917f; --faint:#6b6356;
    --gold:#d4af37; --gold-dim:#b08d2f; --line:#2e2a22; --red:#e57373; --red-bg:#2a1614; --green:#81c784; --green-bg:#16241a;
    --amber:#e0b85a; --amber-bg:#2a2210;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg);}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif; color:var(--ink); min-height:100vh; font-size:15px;
       background-image:radial-gradient(ellipse 80% 40% at 50% -10%, rgba(212,175,55,.07), transparent);
       padding-bottom:calc(90px + env(safe-area-inset-bottom));}
  button,input,select,textarea{font:inherit; color:inherit;}
  .wrap{max-width:860px; margin:0 auto; padding:0 16px;}
  .hidden{display:none !important;}

  /* Üst bar */
  .top{position:sticky; top:0; z-index:20; background:rgba(13,12,10,.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
       padding-top:env(safe-area-inset-top);}
  .topin{display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:center; gap:10px; padding:10px 0;}
  .topin img{height:auto; max-height:66px; max-width:100%; width:auto; display:block;}
  .logowrap{position:relative; justify-self:start; min-width:0;}
  .logobtn{display:block; background:none; border:none; padding:0; cursor:pointer; border-radius:8px; max-width:100%;}
  .logobtn:focus-visible{outline:2px solid var(--gold); outline-offset:3px;}
  .umenu{position:absolute; top:calc(100% + 8px); left:0; z-index:40; min-width:210px; background:var(--card2); border:1px solid var(--gold-dim);
         border-radius:12px; padding:6px; box-shadow:0 12px 32px rgba(0,0,0,.55);}
  .umenu .uinfo{padding:8px 10px 10px; font-size:12.5px; color:var(--muted); border-bottom:1px solid var(--line); margin-bottom:4px; line-height:1.4;}
  .umenu .uinfo b{color:var(--ink); font-size:14px;}
  .umenu button{display:block; width:100%; text-align:left; background:none; border:none; padding:11px 10px; border-radius:8px; cursor:pointer; font-size:14px; color:var(--ink);}
  .umenu button:hover{background:var(--card);}
  .brand{font-weight:700; letter-spacing:2.5px; color:var(--gold); font-size:22px; text-align:center; white-space:nowrap;}
  .who{justify-self:end; text-align:right; font-size:12px; color:var(--muted); line-height:1.35;}
  @media (min-width:700px){ .topin img{max-height:84px;} .brand{font-size:28px; letter-spacing:3px;} .who{font-size:13px;} }
  @media (max-width:380px){ .brand{font-size:18px; letter-spacing:1.5px;} }
  .who b{color:var(--ink); font-weight:600;}
  .linkbtn{background:none; border:none; color:var(--gold); cursor:pointer; font-size:12px; padding:0; text-decoration:underline;}
  .tabs{display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; padding-bottom:0;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{background:none; border:none; color:var(--muted); padding:10px 12px; border-bottom:2px solid transparent; cursor:pointer; white-space:nowrap; font-weight:600; font-size:14px;}
  .tab.on{color:var(--gold); border-bottom-color:var(--gold);}
  .tab .n{display:inline-block; min-width:20px; padding:0 6px; margin-left:4px; border-radius:10px; background:var(--card2); color:var(--ink); font-size:12px;}

  .demo{background:var(--amber-bg); color:var(--amber); font-size:12px; text-align:center; padding:6px 10px; border-bottom:1px solid #4a3b16;}
  .demo button{margin-left:6px;}

  /* Genel */
  main.wrap{padding-top:16px;}
  .summary{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;}
  .pill{background:var(--card); border:1px solid var(--line); border-radius:20px; padding:6px 12px; font-size:13px; color:var(--muted);}
  .pill b{color:var(--ink);}
  .pill.red{border-color:#5c2b26; color:var(--red);} .pill.red b{color:var(--red);}
  .empty{text-align:center; color:var(--muted); padding:48px 16px; border:1px dashed var(--line); border-radius:14px;}
  .search{width:100%; background:var(--bg2); border:1px solid var(--line); border-radius:10px; padding:11px 14px; margin-bottom:12px; outline:none;}
  .search:focus{border-color:var(--gold-dim);}
  .seg{display:flex; gap:6px; margin-bottom:12px;}
  .seg button{background:var(--card); border:1px solid var(--line); border-radius:8px; padding:6px 12px; cursor:pointer; font-size:13px; color:var(--muted);}
  .seg button.on{border-color:var(--gold); color:var(--gold);}

  /* İş kartı */
  .list{display:flex; flex-direction:column; gap:10px;}
  .job{display:flex; gap:12px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; cursor:pointer; transition:border-color .15s; align-items:flex-start;}
  .job:hover{border-color:var(--gold-dim);}
  .job.late{border-left:3px solid var(--red);}
  .thumb{width:64px; height:64px; flex:none; border-radius:10px; background:var(--bg2); border:1px solid var(--line); overflow:hidden; display:flex; align-items:center; justify-content:center; color:var(--faint); font-size:22px;}
  .thumb img{width:100%; height:100%; object-fit:cover;}
  .jb{flex:1; min-width:0;}
  .jt{font-weight:600; font-size:15px; overflow:hidden; text-overflow:ellipsis;}
  .jt .no{color:var(--gold); margin-right:6px;}
  .jm{font-size:12.5px; color:var(--muted); margin-top:3px;}
  .jm.cust{color:var(--ink); opacity:.8;}
  .jr{text-align:right; flex:none; display:flex; flex-direction:column; align-items:flex-end; gap:6px;}
  .price{font-weight:700; font-size:16px; font-variant-numeric:tabular-nums;}
  .badge{display:inline-block; font-size:11px; font-weight:600; padding:3px 8px; border-radius:6px; letter-spacing:.3px; white-space:nowrap;}
  .b-wait{background:var(--amber-bg); color:var(--amber);}
  .b-late{background:var(--red-bg); color:var(--red);}
  .b-ok{background:var(--green-bg); color:var(--green);}
  .b-gray{background:var(--card2); color:var(--muted);}
  .chips{display:flex; flex-wrap:wrap; gap:4px; margin-top:4px;}
  .chip{font-size:11.5px; color:var(--gold); border:1px solid #4a3d18; border-radius:6px; padding:1px 7px;}

  .fab{position:fixed; right:max(16px, calc(50% - 414px)); bottom:calc(20px + env(safe-area-inset-bottom)); z-index:15;
       background:var(--gold); color:#14110b; border:none; border-radius:28px; padding:14px 22px; font-weight:700; font-size:15px; cursor:pointer;
       box-shadow:0 6px 24px rgba(212,175,55,.25);}

  /* Haftalar */
  .week{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:12px;}
  .week.unpaid{border-color:#5c2b26;}
  .wh{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .wh h3{font-size:16px; font-weight:600;}
  .wh .badge{margin-left:auto;}
  .wstats{display:flex; flex-wrap:wrap; gap:18px; margin-top:12px;}
  .wstat .l{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.8px;}
  .wstat .v{font-size:20px; font-weight:700; margin-top:2px; font-variant-numeric:tabular-nums;}
  .wstat .v.gold{color:var(--gold);}
  .wnote{margin-top:10px; font-size:12.5px;}
  .wnote.warn{color:var(--amber);} .wnote.red{color:var(--red);} .wnote.ok{color:var(--green);}
  .wrows{margin-top:12px; border-top:1px solid var(--line);}
  .wrow{display:flex; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); font-size:13.5px; cursor:pointer;}
  .wrow:last-child{border-bottom:none;}
  .wrow .d{color:var(--muted); width:70px; flex:none;}
  .wrow .t{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .wrow .p{font-variant-numeric:tabular-nums; font-weight:600;}
  .wbtns{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
  .toggle{background:none; border:none; color:var(--gold); cursor:pointer; font-size:13px; margin-top:10px; padding:0;}

  /* Butonlar & formlar */
  .btn{background:var(--card2); border:1px solid var(--line); border-radius:10px; padding:11px 16px; cursor:pointer; font-weight:600; font-size:14px;}
  .btn:hover{border-color:var(--gold-dim);}
  .btn.gold{background:var(--gold); border-color:var(--gold); color:#14110b;}
  .btn.danger{color:var(--red); border-color:#5c2b26; background:transparent;}
  .btn.ghost{background:transparent;}
  .btn.block{width:100%;}
  .btn:disabled{opacity:.5; cursor:default;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:5px; letter-spacing:.3px;}
  .field input,.field textarea,.field select{width:100%; background:var(--bg2); border:1px solid var(--line); border-radius:10px; padding:11px 12px; outline:none;}
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--gold-dim);}
  .field textarea{min-height:64px; resize:vertical;}
  input[type=date]{cursor:pointer;}
  input[type=date]::-webkit-calendar-picker-indicator{cursor:pointer; filter:invert(.75) sepia(1) saturate(3) hue-rotate(5deg);}
  .field .hint{font-size:11.5px; color:var(--faint); margin-top:4px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .opts{display:flex; flex-wrap:wrap; gap:6px;}
  .opt{background:var(--bg2); border:1px solid var(--line); border-radius:8px; padding:7px 11px; cursor:pointer; font-size:13px; color:var(--muted);}
  .opt.on{border-color:var(--gold); color:var(--gold); background:#1f1a0e;}
  .section{font-size:11px; color:var(--gold-dim); text-transform:uppercase; letter-spacing:1.2px; margin:18px 0 10px; font-weight:600;}
  .err{background:var(--red-bg); border:1px solid #5c2b26; color:var(--red); border-radius:10px; padding:10px 12px; font-size:13px; margin-bottom:12px;}
  .info{background:var(--card); border:1px solid var(--line); color:var(--muted); border-radius:10px; padding:10px 12px; font-size:13px; margin-bottom:12px;}
  .info.warn{background:var(--amber-bg); border-color:#4a3b16; color:var(--amber);}

  /* Giriş */
  .login{max-width:380px; margin:0 auto; padding:48px 16px;}
  .login img{display:block; height:130px; margin:0 auto 10px;}
  .login h1{text-align:center; color:var(--gold); font-size:20px; letter-spacing:2px; margin-bottom:26px;}
  .login .alt{text-align:center; margin-top:16px; font-size:13px; color:var(--muted);}

  /* Alt pencere (sheet) */
  .modal{position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.6); display:flex; align-items:flex-end; justify-content:center;}
  .sheet{background:var(--bg2); border:1px solid var(--line); border-bottom:none; width:100%; max-width:600px; max-height:92vh; overflow-y:auto;
         border-radius:18px 18px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom));}
  @media (min-width:700px){ .modal{align-items:center;} .sheet{border-radius:18px; border-bottom:1px solid var(--line); max-height:88vh;} }
  .sh{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .sh h2{font-size:18px; font-weight:600;}
  .sh h2 .no{color:var(--gold);}
  .x{margin-left:auto; background:var(--card2); border:1px solid var(--line); border-radius:50%; width:34px; height:34px; cursor:pointer; font-size:16px; color:var(--muted);}
  .photo{position:relative; border-radius:12px; overflow:hidden; background:var(--card); border:1px solid var(--line); margin-bottom:10px;}
  .photo img{display:block; width:100%; max-height:340px; object-fit:contain; background:#000;}
  .photobar{display:flex; gap:8px; margin-bottom:12px;}
  .kv{display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:14px; margin-bottom:14px;}
  .kv .k{color:var(--muted);}
  .actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:16px;}
  .actions .btn{flex:1; min-width:120px;}
  .bigprice input{font-size:24px; font-weight:700; text-align:center; padding:14px;}
  .fire{font-size:13px; color:var(--muted); margin-top:-4px; margin-bottom:12px;}

  .toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(84px + env(safe-area-inset-bottom)); z-index:60; background:var(--card2); border:1px solid var(--gold-dim);
         color:var(--ink); padding:10px 16px; border-radius:10px; font-size:14px; opacity:0; pointer-events:none; transition:opacity .2s; max-width:90vw;}
  .toast.show{opacity:1;}
  .toast.bad{border-color:var(--red); color:var(--red);}
  .users .u{display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:8px;}
  .users .u .nm{font-weight:600;} .users .u .dt{font-size:12px; color:var(--muted);}
  .users .u select{margin-left:auto; background:var(--bg2); border:1px solid var(--line); border-radius:8px; padding:8px; outline:none;}
  .cardbtns{display:flex; gap:6px; margin-top:9px; flex-wrap:wrap;}
  .btn.sm{padding:7px 11px; font-size:13px; border-radius:8px;}
  .btn.wa{background:#15301f; border-color:#285c3a; color:#8fe0a8;}
  .toolbar{display:flex; gap:8px; justify-content:flex-end; margin-bottom:12px; flex-wrap:wrap;}
  .fisimg{display:block; width:100%; border-radius:10px; background:#fff; margin-bottom:12px;}
  .chk{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); margin:-4px 0 12px;}
  .sigpad{display:block; width:100%; height:210px; background:#fff; border-radius:10px; border:2px dashed var(--gold-dim); touch-action:none; cursor:crosshair;}
  .sigimg{display:block; max-width:100%; max-height:160px; background:#fff; border-radius:8px; padding:6px; margin:6px 0 4px;}
  .beyan{font-size:13.5px; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:10px; line-height:1.45;}
  .teslimbox{background:var(--green-bg); border:1px solid #2e5e40; border-radius:10px; padding:10px 12px; margin:4px 0 12px; font-size:13.5px;}
  #printArea{display:none;}
  @media print{
    html,body{background:#fff !important;}
    body > *:not(#printArea){display:none !important;}
    #printArea{display:block !important;} #printArea img{width:100%;}
    @page{margin:8mm;}
  }
  footer{margin-top:36px; text-align:center; font-size:11px; color:#5c554a; letter-spacing:1px;}
  .spin{color:var(--muted); text-align:center; padding:40px;}
</style>
</head>
<body>
<div id="app"><div class="spin">Yükleniyor…</div></div>
<div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
<div id="toast" class="toast"></div>
<div id="printArea"><img id="printImg" alt=""></div>

function weekLabel(mon){
  const a = toDate(mon), b = toDate(addDays(mon, 5));
  return a.getMonth() === b.getMonth() ? `${a.getDate()}–${b.getDate()} ${AY[b.getMonth()]} ${b.getFullYear()}`

}

function parseNum(s){
  s = String(s ?? "").trim().replace(/\s|₺|gr/gi, "");
  if(!s) return null;
  if(s.includes(",") && s.includes(".")) s = s.replace(/\./g, "").replace(",", ".");
  else if(s.includes(",")) s = s.replace(",", ".");
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, "");
  const n = Number(s);
  return Number.isFinite(n) ? n : NaN;
}

  return `${z(d.getDate())}.${z(d.getMonth() + 1)}.${d.getFullYear()} ${z(d.getHours())}:${z(d.getMinutes())}`; };
const fTR = iso => { if(!iso) return ""; const [y,m,d] = String(iso).slice(0,10).split("-"); return `${d}.${m}.${y}`; };

function waPhone(t){
  let d = String(t || "").replace(/\D/g, "");

  if(d.startsWith("00")) d = d.slice(2);
  if(d.startsWith("0")) d = "90" + d.slice(1);

/* ============ Fotoğraf küçültme ============ */
async function compressImage(file){
  let src;
  try { src = await createImageBitmap(file, {imageOrientation:"from-image"}); }
  catch(_) {
    src = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
  }
  const w = src.width, h = src.height, max = 1600, s = Math.min(1, max / Math.max(w, h));
  const c = document.createElement("canvas"); c.width = Math.round(w * s); c.height = Math.round(h * s);
  c.getContext("2d").drawImage(src, 0, 0, c.width, c.height);
  return await new Promise(res => c.toBlob(res, "image/jpeg", 0.8));
}

function makeDemoApi(){
  const t = todayISO();
  const users = [
    { id:"u1", username:"gurel", role:"kuyumcu", created_at: addDays(t,-60)+"T10:00:00" },

  J({ urun:"14A Kolye", islem:"Kilit / klips", gonderilen_gram:4.1, donen_gram:4.1, verilis_tarihi:addDays(prevMon,1), donus_tarihi:addDays(prevMon,4), durum:"tamamlandi", fiyat:200, fiyat_giren:"u2" });
  J({ urun:"14A Yüzük", islem:"Boy ayarı", gonderilen_gram:2.9, donen_gram:2.95, verilis_tarihi:addDays(lastMon,0), donus_tarihi:addDays(lastMon,1), durum:"tamamlandi", fiyat:250, fiyat_giren:"u2" }, {ad:"Ali V.", telefon:""});
  J({ urun:"22A Bilezik", islem:"Lehim, Cila", gonderilen_gram:20.07, donen_gram:20.02, verilis_tarihi:addDays(lastMon,1), donus_tarihi:addDays(lastMon,3), durum:"tamamlandi", fiyat:500, fiyat_giren:"u1" });
  J({ urun:"14A Küpe", islem:"Kilit / klips", gonderilen_gram:1.2, donen_gram:1.2, verilis_tarihi:addDays(lastMon,2), donus_tarihi:addDays(lastMon,5), durum:"tamamlandi", fiyat:null }, {ad:"Hatice D.", telefon:"0533 222 33 44"});
  J({ urun:"14A Zincir", islem:"Zincir tamiri", gonderilen_gram:6.5, verilis_tarihi:addDays(t,-6), beklenen_tarih:addDays(t,-2), fiyat:300, fiyat_giren:"u2", fiyat_zamani:new Date().toISOString() }, {ad:"Zeynep A.", telefon:"0544 000 00 00"});
  J({ urun:"14A Tektaş Yüzük", islem:"Taş takma", aciklama:"Taş yerinden oynuyor, müşteri cumaya istiyor", gonderilen_gram:2.4, verilis_tarihi:addDays(t,-2), beklenen_tarih:addDays(t,3) }, {ad:"Elif S.", telefon:"0555 123 45 67"});
  J({ urun:"22A Burma Bilezik", islem:"Lehim", gonderilen_gram:15.95, verilis_tarihi:addDays(t,-1) });
  pays.push({ hafta:prevMon, tutar:550, odeme_tarihi:addDays(prevMon,5), odeyen:"u1", aciklama:null });

  const need = roles => { if(!me || !roles.includes(me.role)) throw new Error("Bu işlem için yetkin yok."); };
  const view = j => ({ ...JSON.parse(JSON.stringify(j)), musteri: me.role === "kuyumcu" ? (mus[j.id] ? {...mus[j.id]} : null) : null });
  const fileUrl = blob => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });
  const sleep = () => new Promise(r => setTimeout(r, 60));
  return {
    demo:true,
    async session(){ await sleep(); return me ? { user:{ id:me.id }, profile:{...me} } : null; },
    async signIn(u){ const x = users.find(z => z.username === u); if(!x) throw new Error("Invalid login credentials"); me = x; },
    async signUp(u){ if(users.find(z => z.username === u)) throw new Error("User already registered"); me = { id:"u"+(users.length+1), username:u, role:null, created_at:new Date().toISOString() }; users.push(me); },
    async signOut(){ me = null; },
    async openJobs(){ await sleep(); need(["kuyumcu","tamirci"]); return jobs.filter(j => j.durum === "tamirde").sort((a,b) => a.verilis_tarihi.localeCompare(b.verilis_tarihi) || a.id-b.id).map(view); },
    async closedJobs(){ await sleep(); need(["kuyumcu","tamirci"]); return jobs.filter(j => j.durum !== "tamirde").sort((a,b) => (b.donus_tarihi||"").localeCompare(a.donus_tarihi||"") || b.id-a.id).map(view); },

      need(["kuyumcu"]); const j = jobs.find(x => x.id === id);
      if(f.durum === "tamamlandi" && !(f.donus_tarihi || j.donus_tarihi)) throw new Error("Dönüş tarihi gerekli");
      Object.assign(j, f);
      if(m !== undefined){ if(m && (m.ad||m.telefon)) mus[id] = m; else delete mus[id]; }
      if(photoOp === "remove") j.foto_path = null; else if(photoOp instanceof Blob) j.foto_path = await fileUrl(photoOp);
    },
    async setPrice(id, price){
      need(["kuyumcu","tamirci"]); const j = jobs.find(x => x.id === id);
      if(me.role === "tamirci" && j.durum !== "tamirde") throw new Error("Tamamlanmış işin fiyatı değiştirilemez");
      if(price != null && price < 0) throw new Error("Fiyat negatif olamaz");
      j.fiyat = price; j.fiyat_giren = price == null ? null : me.id; j.fiyat_zamani = price == null ? null : new Date().toISOString();
    },
    async deleteJob(id){ need(["kuyumcu"]); jobs.splice(jobs.findIndex(x => x.id === id), 1); delete mus[id]; },
    async deliver(id, blob){
      need(["kuyumcu"]); const j = jobs.find(x => x.id === id);
      if(j.durum !== "tamamlandi") throw new Error("Ürün henüz tamirden gelmedi");
      if(j.musteri_teslim_zamani) throw new Error("Bu ürün zaten teslim edilmiş");
      const z = new Date().toISOString();
      Object.assign(j, { musteri_teslim_zamani:z, musteri_teslim_tarihi:todayISO(), musteri_teslim_eden:me.id });
      if(mus[id]) mus[id].imza_path = blob ? await fileUrl(blob) : null;
      return z;
    },
    async photoUrls(paths){ const o = {}; paths.forEach(p => o[p] = p); return o; },
    async payments(){ need(["kuyumcu","tamirci"]); return pays.map(p => ({...p})).sort((a,b) => b.hafta.localeCompare(a.hafta)); },
    async markPaid(hafta, tutar, aciklama){ need(["kuyumcu"]); const i = pays.findIndex(p => p.hafta === hafta); const p = { hafta, tutar, aciklama, odeme_tarihi:todayISO(), odeyen:me.id }; if(i >= 0) pays[i] = p; else pays.push(p); },
    async unmarkPaid(hafta){ need(["kuyumcu"]); const i = pays.findIndex(p => p.hafta === hafta); if(i >= 0) pays.splice(i, 1); },
    async profiles(){ need(["kuyumcu","tamirci"]); return users.map(u => ({...u})); },
    async setRole(id, role){ need(["kuyumcu"]); if(id === me.id) throw new Error("Kendi rolünü değiştiremezsin"); users.find(u => u.id === id).role = role; },
    async changePassword(userId, yeni, eski){
      if(!me) throw new Error("Giriş yapmalısın");
      if(String(yeni || "").length < 6) throw new Error("Şifre en az 6 karakter olmalı");
      if(userId === me.id){ if(!eski) throw new Error("Mevcut şifre hatalı"); return; }
      need(["kuyumcu"]); const h = users.find(u => u.id === userId);
      if(h.username === "gurel" && me.username !== "gurel") throw new Error("Yönetici hesabının şifresini sadece kendisi değiştirebilir");
    },
    _as(username){ me = users.find(u => u.username === username); },
  };
}

async function loadAll(silent){
  if(S.loading) return; S.loading = true;
  try{
    const [open, closed, pays, profiles] = await Promise.all([api.openJobs(), api.closedJobs(), api.payments(), api.profiles()]);
    Object.assign(S, { open, closed, pays, profiles, fresh:false });
    const paths = [...open, ...closed].flatMap(j => [j.foto_path, j.musteri && j.musteri.imza_path]).filter(p => p && !S.urls[p]);
    if(paths.length) Object.assign(S.urls, await api.photoUrls(paths));
  }catch(e){ if(!silent) toast(trErr(e), true); }
  finally{ S.loading = false; }
  render();
}

/* ============ Haftalar ============ */
function weeksData(){
  const wk = {};
  const get = mon => wk[mon] || (wk[mon] = { mon, jobs:[], total:0, noPrice:0, fire:0, added:0, fireN:0, pay:null });
  get(weekStart(todayISO()));
  S.closed.filter(j => j.durum === "tamamlandi" && j.donus_tarihi).forEach(j => {
    const w = get(weekStart(j.donus_tarihi)); w.jobs.push(j);
    if(j.fiyat == null) w.noPrice++; else w.total += Number(j.fiyat);
    const f = fireOf(j);
    if(f != null){ w.fireN++; if(f >= 0) w.fire += f; else w.added += -f; }
  });
  S.pays.forEach(p => { get(p.hafta).pay = p; });
  return Object.values(wk).sort((a,b) => b.mon.localeCompare(a.mon));
}
function payOfJob(j){
  if(j.durum !== "tamamlandi" || !j.donus_tarihi) return null;
  return S.pays.find(p => p.hafta === weekStart(j.donus_tarihi)) || null;
}

function jobCard(j, hazir){

  const late = j.durum === "tamirde" && j.beklenen_tarih && j.beklenen_tarih < t;
  const gun = daysBetween(j.verilis_tarihi, j.durum === "tamirde" ? t : (j.donus_tarihi || t));
  let meta;
  if(j.durum === "tamirde") meta = `${fDate(j.verilis_tarihi)}'de verildi · ${gun === 0 ? "bugün" : gun + " gün"}${j.beklenen_tarih ? ` · beklenen ${fDate(j.beklenen_tarih)}` : ""}`;
  else if(j.durum === "tamamlandi") meta = `${fDate(j.verilis_tarihi)} → ${fDate(j.donus_tarihi)} tamirden geldi · ${gun} gün`;
  else meta = `${fDate(j.verilis_tarihi)}'de verildi · iptal`;
  const fr = fireOf(j);
  const gram = j.gonderilen_gram != null ? (fr != null
      ? `${fGr(j.gonderilen_gram)} → ${fGr(j.donen_gram)} (${fireText(fr).toLowerCase()})` : fGr(j.gonderilen_gram)) : "";
  const right = [];

  else right.push(`<span class="badge b-wait">Fiyat yok</span>`);
  if(late) right.push(`<span class="badge b-late">Gecikti</span>`);
  if(j.durum === "tamamlandi" && payOfJob(j)) right.push(`<span class="badge b-ok">Ödendi</span>`);

function weeksView(){
  const weeks = weeksData(), t = todayISO(), cur = weekStart(t), k = isK();
  const unpaid = weeks.filter(w => !w.pay && w.jobs.length);
  const unpaidSum = unpaid.reduce((a,w) => a + w.total, 0);
  const openSum = S.open.filter(j => j.fiyat != null).reduce((a,j) => a + Number(j.fiyat), 0);
  let h = (k ? `<div class="toolbar"><button class="btn sm" data-act="excel">⬇ Excel'e aktar</button></div>` : "") + `<div class="summary">
    <span class="pill ${unpaidSum ? "red" : ""}">Ödenmemiş toplam <b>${fTL(unpaidSum)}</b></span>
    <span class="pill">Tamirdeki işlerin girilen fiyatı <b>${fTL(openSum)}</b></span>
  </div>`;
  h += weeks.map(w => {
    const isCur = w.mon === cur;
    const sat = addDays(w.mon, 5);
    const overdue = !w.pay && w.jobs.length && t > sat;
    let badge;
    if(w.pay) badge = `<span class="badge b-ok">Ödendi · ${fDate(w.pay.odeme_tarihi)}</span>`;
    else if(!w.jobs.length) badge = `<span class="badge b-gray">${isCur ? "Bu hafta" : "İş yok"}</span>`;
    else if(overdue) badge = `<span class="badge b-late">Ödenmedi</span>`;
    else badge = `<span class="badge b-wait">${isCur ? "Bu hafta · ödeme Cmt" : "Ödeme bekliyor"}</span>`;
    const notes = [];
    if(w.noPrice) notes.push(`<div class="wnote warn">⚠ ${w.noPrice} işin fiyatı girilmemiş — toplama dahil değil.</div>`);
    if(w.pay && Math.abs(Number(w.pay.tutar) - w.total) > 0.005)
      notes.push(`<div class="wnote red">Ödenen ${fTL(w.pay.tutar)}, güncel toplam ${fTL(w.total)} · fark ${fTL(w.total - Number(w.pay.tutar))}</div>`);
    if(w.pay && w.pay.aciklama) notes.push(`<div class="wnote">Not: ${esc(w.pay.aciklama)}</div>`);
    const exp = S.expanded[w.mon] ?? isCur;
    const rows = w.jobs.slice().sort((a,b) => a.donus_tarihi.localeCompare(b.donus_tarihi) || a.id - b.id).map(j =>
      `<div class="wrow" data-act="open-job" data-id="${j.id}"><span class="d">${fDateDay(j.donus_tarihi)}</span>
        <span class="t"><span style="color:var(--gold)">#${j.id}</span> ${esc(j.urun)}${j.islem ? ` · <span style="color:var(--muted)">${esc(j.islem)}</span>` : ""}</span>
        <span class="p">${j.fiyat != null ? fTL(j.fiyat) : `<span class="badge b-wait">Fiyat yok</span>`}</span></div>`).join("");
    const btns = k && w.jobs.length ? `<div class="wbtns">${w.pay
        ? `<button class="btn ghost" data-act="unpay" data-w="${w.mon}">Ödemeyi geri al</button>`
        : `<button class="btn gold" data-act="pay" data-w="${w.mon}">Ödendi olarak işaretle</button>`}</div>` : "";
    return `<div class="week ${overdue ? "unpaid" : ""}">
      <div class="wh"><h3>${weekLabel(w.mon)}</h3>${badge}</div>
      <div class="wstats">
        <div class="wstat"><div class="l">İş</div><div class="v">${w.jobs.length}</div></div>
        <div class="wstat"><div class="l">Tamir bedeli</div><div class="v gold">${fTL(w.total)}</div></div>
        ${w.fire > 0.004 ? `<div class="wstat"><div class="l">Fire</div><div class="v">${fGr(w.fire)}</div></div>` : ""}
        ${w.added > 0.004 ? `<div class="wstat"><div class="l">Eklenen altın</div><div class="v">${fGr(w.added)}</div></div>` : ""}
      </div>
      ${notes.join("")}
      ${w.jobs.length ? `<button class="toggle" data-act="wtoggle" data-w="${w.mon}">${exp ? "▾ İşleri gizle" : "▸ İşleri göster"}</button>
        ${exp ? `<div class="wrows">${rows}</div>` : ""}` : ""}
      ${btns}
    </div>`;
  }).join("");
  return h;
}

function ask(msg, okLabel = "Evet", danger = false){

function readJobForm(){
  const f = $("#jobForm"), v = n => (f.elements[n] ? f.elements[n].value.trim() : undefined);
  const g = parseNum(v("gonderilen_gram")), fi = parseNum(v("fiyat")), dg = parseNum(v("donen_gram"));
  if(!v("urun")) throw new Error("Ürün adı gerekli.");
  if(Number.isNaN(g) || (g != null && g < 0)) throw new Error("Gönderilen gram geçersiz.");
  if(Number.isNaN(fi) || (fi != null && fi < 0)) throw new Error("Fiyat geçersiz.");
  if(Number.isNaN(dg) || (dg != null && dg < 0)) throw new Error("Dönen gram geçersiz.");
  if(v("beklenen_tarih") && v("beklenen_tarih") < v("verilis_tarihi")) throw new Error("Beklenen dönüş, veriliş tarihinden önce olamaz.");
  const fields = { urun:v("urun"), islem:[...SH.islem].join(", ") || null, aciklama:v("aciklama") || null, gonderilen_gram:g,
                   verilis_tarihi:v("verilis_tarihi"), beklenen_tarih:v("beklenen_tarih") || null };
  fields.donen_gram = dg;
  if(v("donus_tarihi") !== undefined){ fields.donus_tarihi = v("donus_tarihi"); if(!fields.donus_tarihi) throw new Error("Dönüş tarihi gerekli."); }
  if(v("musteri_teslim_tarihi") !== undefined){
    fields.musteri_teslim_tarihi = v("musteri_teslim_tarihi") || null;
    if(fields.musteri_teslim_tarihi && fields.donus_tarihi && fields.musteri_teslim_tarihi < fields.donus_tarihi) throw new Error("Müşteriye teslim, tamirden dönüşten önce olamaz.");
  }
  if(SH.job && SH.job.musteri && SH.job.musteri.imza_path && !v("m_ad") && !v("m_tel")) throw new Error("İmzalı teslim kaydı olan işte müşteri bilgisi silinemez.");
  return { fields, fiyat:fi, musteri:{ ad:v("m_ad") || null, telefon:v("m_tel") || null } };
}

async function saveJob(withFis){
  const { fields, fiyat, musteri } = readJobForm();
  const j = SH.job;
  if(!j){
    const id = await api.createJob(fields, musteri, SH.photoBlob);
    if(fiyat != null) await api.setPrice(id, fiyat);
    toast(`#${id} kaydedildi`);
    closeSheet(); await loadAll();
    if(withFis) await openFis(id);
    return;
  } else {
    const photoOp = SH.photoBlob || (SH.photoRemove ? "remove" : null);
    await api.updateJob(j.id, fields, musteri, photoOp, j.foto_path);
    if((fiyat ?? null) !== (j.fiyat == null ? null : Number(j.fiyat))) await api.setPrice(j.id, fiyat);
    toast(`#${j.id} güncellendi`);
  }
  closeSheet(); await loadAll();
}

async function doComplete(){
  const f = $("#completeForm"), j = SH.job, P = SH.pending;
  const dg = parseNum(f.elements.donen_gram.value), fi = parseNum(f.elements.fiyat.value);
  if(Number.isNaN(dg) || (dg != null && dg < 0)) throw new Error("Dönen gram geçersiz.");

    x.fillStyle = "#111"; x.beginPath(); x.arc(last.x, last.y, 1.3, 0, Math.PI * 2); x.fill(); SH.teslim.pts++; };

function openPwSheet(uid){
  const self = uid === S.me.id, p = S.profiles.find(x => x.id === uid) || S.me;
  openSheet(`<div class="sh"><h2>${self ? "Şifremi değiştir" : `Şifre sıfırla · ${esc(p.username)}`}</h2><button class="x" data-act="close">✕</button></div>
    ${self ? "" : `<div class="info">Yeni şifreyi <b>${esc(p.username)}</b> kişisine kendin ilet. Kişi girdikten sonra <b>Şifre</b> bağlantısından kendi şifresini belirleyebilir.</div>`}
    <form id="pwForm" data-uid="${uid}">
      ${self ? `<div class="field"><label>Mevcut şifre</label><input name="eski" type="password" autocomplete="current-password" required></div>` : ""}
      <div class="field"><label>Yeni şifre (en az 6 karakter)</label><input name="yeni" type="password" autocomplete="new-password" required minlength="6"></div>
      <div class="field"><label>Yeni şifre (tekrar)</label><input name="yeni2" type="password" autocomplete="new-password" required></div>
      <label class="chk"><input type="checkbox" id="pwShow"> Şifreyi göster</label>
      <button class="btn gold block" type="submit">${self ? "Şifremi değiştir" : "Şifreyi sıfırla"}</button>
    </form>`);
}

/* ============ Logo menüsü ============ */
function closeMenu(){ const m = document.querySelector(".umenu"); if(m) m.remove(); }
function toggleMenu(){
  if(document.querySelector(".umenu")) return closeMenu();
  const w = document.querySelector(".logowrap"); if(!w || !S.me) return;
  const d = document.createElement("div"); d.className = "umenu"; d.setAttribute("role", "menu");
  d.innerHTML = `<div class="uinfo"><b>${esc(S.me.username)}</b><br>${isK() ? "Kuyumcu" : "Tamirci"}</div>
    <button role="menuitem" data-act="pw" data-uid="${S.me.id}">🔑 Şifre değiştir</button>
    <button role="menuitem" data-act="logout">↩ Çıkış</button>`;
  w.appendChild(d);
}
document.addEventListener("click", e => { if(!e.target.closest(".logowrap")) closeMenu(); }, true);
document.addEventListener("keydown", e => { if(e.key === "Escape") closeMenu(); });

/* ============ Olaylar ============ */
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]"); if(!el) return;
  const a = el.dataset.act;
  try{
    if(a === "tab"){ S.tab = el.dataset.tab; render(); window.scrollTo(0,0); }
    else if(a === "auth-mode"){ S.authMode = el.dataset.m; S.authErr = ""; render(); }
    else if(a === "logout"){ closeMenu(); await api.signOut(); Object.assign(S, { me:null, tab:"tamirde", open:[], closed:[], pays:[], profiles:[], urls:{}, q:"" }); render(); }
    else if(a === "recheck"){ await boot(); }
    else if(a === "demo-as"){ api._as(el.dataset.u); await boot(); }
    else if(a === "new") openJobSheet(null);
    else if(a === "open-job") openJobSheet(Number(el.dataset.id));
    else if(a === "close") closeSheet();
    else if(a === "islem"){ const v = el.dataset.v; SH.islem.has(v) ? SH.islem.delete(v) : SH.islem.add(v); el.classList.toggle("on"); }
    else if(a === "photo-rm"){ snapshotInputs(); SH.photoBlob = null; SH.photoPreview = null; SH.photoRemove = true; rerenderJobForm(); }
    else if(a === "complete") openCompleteSheet();
    else if(a === "cancel-job"){ const j = SH.job; if(await ask(`#${j.id} ${esc(j.urun)} iptal edilsin mi? (Tamirci de görür.)`, "İptal et", true)){ await api.updateJob(j.id, { durum:"iptal" }); toast("İptal edildi"); closeSheet(); await loadAll(); } }
    else if(a === "reopen"){ const j = SH.job; if(await ask(`#${j.id} tekrar 'tamirde' durumuna alınsın mı? Dönüş tarihi, dönen gram ve müşteri teslim bilgisi silinir.`, "Tamire geri al")){ await api.updateJob(j.id, { durum:"tamirde", donus_tarihi:null, donen_gram:null, musteri_teslim_tarihi:null, musteri_haber:null }); toast("Tamire geri alındı"); closeSheet(); await loadAll(); } }
    else if(a === "delete-job"){ const j = SH.job, imza = j.musteri && j.musteri.imza_path;
      if(await ask(`#${j.id} ${esc(j.urun)} kalıcı olarak silinsin mi? Bu geri alınamaz.${imza ? "<br><b>Müşterinin teslim imzası da silinir.</b>" : ""}`, "Sil", true)){
        await api.deleteJob(j.id, j.foto_path, imza && !imza.startsWith("data:") ? imza : null); toast("Silindi"); closeSheet(); await loadAll(); } }
    else if(a === "wtoggle"){ const w = el.dataset.w; const cur = weekStart(todayISO()); S.expanded[w] = !(S.expanded[w] ?? (w === cur)); render(); }
    else if(a === "pay") openPaySheet(el.dataset.w);
    else if(a === "unpay"){ if(await ask(`${weekLabel(el.dataset.w)} haftasının ödeme kaydı silinsin mi?`, "Geri al", true)){ await api.unmarkPaid(el.dataset.w); toast("Ödeme kaydı silindi"); await loadAll(); } }
    else if(a === "hf"){ S.hfilter = el.dataset.v; render(); }
    else if(a === "excel") exportExcel();
    else if(a === "menu") toggleMenu();
    else if(a === "wa"){
      const j = findJob(Number(el.dataset.id)), ph = waPhone(j && j.musteri?.telefon);
      if(!ph) return toast("Geçerli telefon numarası yok", true);
      window.open(`https://wa.me/${ph}?text=${encodeURIComponent(waMesaj(j))}`, "_blank");
      await api.updateJob(j.id, { musteri_haber:new Date().toISOString() });
      toast("Haber verildi olarak kaydedildi"); if(SH && SH.job) closeSheet(); await loadAll();
    }
    else if(a === "mteslim") openTeslimSheet(Number(el.dataset.id));
    else if(a === "sig-clear") SH.teslim.clear();
    else if(a === "sig-save"){ el.disabled = true; const id = SH.teslim.id;
      try { await doDeliver(id, await sigBlob()); } catch(err){ el.disabled = false; throw err; } }
    else if(a === "imzasiz"){ const id = Number(el.dataset.id), j = findJob(id);
      if(await ask(`#${id} ${esc(j.urun)} <b>imzasız</b> olarak teslim edilsin mi? Kayıtta "imzasız teslim" yazacak; inkâr durumunda kanıtın zayıf olur.`, "İmzasız teslim et", true)) await doDeliver(id, null);
      else openTeslimSheet(id); }
    else if(a === "fis") await openFis(Number(el.dataset.id));
    else if(a === "fis-dl"){ saveBlob(SH.fis.blob, SH.fis.name); }
    else if(a === "fis-print"){ window.print(); }
    else if(a === "fis-share"){
      const f = SH.fis, file = new File([f.blob], f.name, { type:"image/png" });
      try { await navigator.share({ files:[file], title:`Emanet fişi #${f.id}`, text:`Gürel Kuyumculuk emanet fişi #${f.id}` }); }
      catch(err){ if(err && err.name !== "AbortError") saveBlob(f.blob, f.name); }
    }
    else if(a === "pw"){ closeMenu(); openPwSheet(el.dataset.uid); }
  }catch(err){ toast(trErr(err), true); }
});
$("#modal").addEventListener("click", e => { if(e.target.id === "modal") closeSheet(); });
// Tarih alanının herhangi bir yerine tıklanınca takvim açılsın (sadece simgeye değil)
document.addEventListener("click", e => {
  const el = e.target;
  if(el instanceof HTMLInputElement && el.type === "date" && !el.disabled && !el.readOnly && typeof el.showPicker === "function"){
    try { el.showPicker(); } catch(_) {}
  }
});
document.addEventListener("keydown", e => { if(e.key === "Escape" && !$("#modal").classList.contains("hidden")) closeSheet(); });

function snapshotInputs(){ if(!SH) return; SH.values = {}; $("#sheet").querySelectorAll("input[name],textarea[name],select[name]").forEach(el => { if(el.type !== "file") SH.values[el.name] = el.value; }); }
function rerenderJobForm(){ const f = $("#jobForm"); if(!f) return; const sel = SH.islem; const wrap = document.createElement("div"); wrap.innerHTML = jobForm(SH.job); f.replaceWith(wrap.firstElementChild);
  SH.islem = sel; $("#islemOpts").querySelectorAll(".opt").forEach(b => b.classList.toggle("on", sel.has(b.dataset.v))); restoreSheetInputs(); updFormFire(); }

document.addEventListener("change", async e => {
  const el = e.target;
  try{
    if(el.id === "pwShow"){ $("#pwForm").querySelectorAll("input[type=password],input[data-pw]").forEach(i => { i.dataset.pw = 1; i.type = el.checked ? "text" : "password"; }); return; }
    if(el.id === "photoIn" && el.files[0]){
      snapshotInputs();
      const blob = await compressImage(el.files[0]);
      SH.photoBlob = blob; SH.photoRemove = false; SH.photoPreview = URL.createObjectURL(blob);
      rerenderJobForm();
    } else if(el.dataset && el.dataset.act === "role"){
      const p = S.profiles.find(x => x.id === el.dataset.id), role = el.value || null;
      const lbl = role ? (role === "kuyumcu" ? "Kuyumcu" : "Tamirci") : "Yetkisiz";
      if(!(await ask(`<b>${esc(p.username)}</b> → ${lbl} yapılsın mı?${role === "kuyumcu" ? "<br>Kuyumcu tüm bilgileri görür ve değiştirebilir." : ""}`, "Onayla"))){ el.value = p.role || ""; return; }
      await api.setRole(p.id, role); toast("Yetki güncellendi"); await loadAll();
    }
  }catch(err){ toast(trErr(err), true); }
});
function updFormFire(){ const f = $("#jobForm"), o = $("#formFire"); if(!f || !o) return;
  const g = parseNum(f.elements.gonderilen_gram.value), d = parseNum(f.elements.donen_gram.value);
  o.textContent = (g != null && d != null && !Number.isNaN(g) && !Number.isNaN(d)) ? fireText(fireOf({ gonderilen_gram:g, donen_gram:d })) : ""; }
document.addEventListener("input", e => { if(e.target.name === "gonderilen_gram" || e.target.name === "donen_gram") updFormFire(); });
document.addEventListener("input", e => { if(e.target.id === "q"){ S.q = e.target.value; const pos = e.target.selectionStart; render(); const q = $("#q"); q.focus(); q.setSelectionRange(pos, pos); } });

document.addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target, btn = e.submitter || f.querySelector("[type=submit]");
  if(btn) btn.disabled = true;
  try{
    if(f.id === "authForm"){
      const u = normUser(f.elements.u.value), p = f.elements.p.value;
      if(!/^[a-z0-9._-]{3,30}$/.test(u)) throw new Error("Kullanıcı adı 3-30 karakter olmalı (harf, rakam, nokta).");
      if(S.authMode === "kayit"){
        if(!api.demo && p.length < 6) throw new Error("Şifre en az 6 karakter olmalı.");
        if(!api.demo && p !== f.elements.p2.value) throw new Error("Şifreler aynı değil.");
        await api.signUp(u, p);
      } else await api.signIn(u, p);
      S.authErr = ""; await boot();
    }
    else if(f.id === "jobForm") await saveJob(!!(e.submitter && e.submitter.dataset.fis));
    else if(f.id === "completeForm") await doComplete();
    else if(f.id === "priceForm"){
      const fi = parseNum(f.elements.fiyat.value);
      if(Number.isNaN(fi) || (fi != null && fi < 0)) throw new Error("Fiyat geçersiz.");
      await api.setPrice(SH.job.id, fi); toast(fi == null ? "Fiyat silindi" : `#${SH.job.id} fiyat: ${fTL(fi)}`); closeSheet(); await loadAll();
    }
    else if(f.id === "pwForm"){
      const uid = f.dataset.uid, yeni = f.elements.yeni.value, self = uid === S.me.id;
      if(yeni.length < 6) throw new Error("Şifre en az 6 karakter olmalı.");
      if(yeni !== f.elements.yeni2.value) throw new Error("Yeni şifreler aynı değil.");
      await api.changePassword(uid, yeni, self ? f.elements.eski.value : null);
      closeSheet(); toast(self ? "Şifren değiştirildi" : "Şifre sıfırlandı — kişiye ilet");
    }
    else if(f.id === "payForm"){
      const t = parseNum(f.elements.tutar.value);
      if(t == null || Number.isNaN(t) || t < 0) throw new Error("Tutar geçersiz.");
      await api.markPaid(f.dataset.w, t, f.elements.aciklama.value.trim() || null); toast("Ödeme kaydedildi"); closeSheet(); await loadAll();
    }
  }catch(err){
    if(f.id === "authForm"){ S.authErr = trErr(err); render(); }
    else toast(trErr(err), true);
  }finally{ if(btn && document.body.contains(btn)) btn.disabled = false; }
});

/* ============ Başlat ============ */
async function boot(){
  const prevId = S.me && S.me.id;
  try{
    const s = await api.session();
    S.me = s ? (s.profile || { id:s.user.id, username:"?", role:null }) : null;
  }catch(e){ S.me = null; S.authErr = trErr(e); }
  // Kullanıcı değiştiyse önceki kişinin verisini ekranda bir an bile gösterme
  if(!S.me || S.me.id !== prevId || S.me.role !== (S._role || null)){ Object.assign(S, { open:[], closed:[], pays:[], profiles:[], fresh:true }); }
  S._role = S.me ? S.me.role : null;
  render();
  if(S.me && S.me.role) await loadAll();
}
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible" && S.me && S.me.role && !SH) loadAll(true); });
setInterval(() => { if(document.visibilityState === "visible" && S.me && S.me.role && !SH) loadAll(true); }, 60000);
boot();
</script>
</body>
</html>
