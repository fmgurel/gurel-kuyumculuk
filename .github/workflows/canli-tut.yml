name: Supabase canli tut

# Her gun Supabase'e kucuk bir istek atar; ucretsiz projenin 1 haftalik
# hareketsizlikte duraklatilmasini onler. Ayin 1'inde depoya kucuk bir dosya
# yazar, cunku GitHub 60 gun hareketsiz depolarda zamanlanmis gorevleri durdurur.
# Istek basarisiz olursa GitHub e-posta ile haber verir.

on:
  schedule:
    - cron: "17 6 * * *"   # her gun 09:17 (Turkiye saati)
  workflow_dispatch:        # Actions sekmesinden elle de calistirilabilir

permissions:
  contents: write

jobs:
  canli-tut:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase'e istek at
        run: |
          curl -sS --fail --retry 3 --retry-delay 20 -X POST \
            "https://uqjrsvdcciesiyezxmyu.supabase.co/rest/v1/rpc/canli_tut" \
            -H "apikey: sb_publishable_Djyr4_u1QnSxNX0zFOWLmQ_ikuOi3XF" \
            -H "Content-Type: application/json" -d '{}'
          echo

      - name: Depoyu getir
        uses: actions/checkout@v4

      - name: Ayda bir depoyu hareketli tut
        run: |
          if [ "$(date -u +%d)" = "01" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            date -u +"%Y-%m-%d %H:%M UTC" > .github/canli-tut.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/canli-tut.txt
            git commit -m "Canli tut: aylik depo hareketi" || echo "Degisiklik yok"
            git push
          else
            echo "Bugun depo guncellemesi yok (sadece ayin 1'inde)."
          fi
